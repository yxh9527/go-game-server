# Complete /etc/nginx/nginx.conf. Replace domain, certificate paths and upstreams.
# One domain: hall 443, client assets 8444, game WebSocket 8445.
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Login links contain tokens: log the URI without query parameters.
    log_format gogame '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent rt=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log gogame;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    map $http_upgrade $game_connection {
        default upgrade;
        '' close;
    }

    upstream gogame_hall { server 127.0.0.1:11042; }
    # client-web cluster already balances its workers on this one port.
    upstream gogame_client { server 127.0.0.1:4000; }
    upstream gogame_game { server 127.0.0.1:11041; }
    upstream gogame_match { server 127.0.0.1:11040; }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    ssl_certificate /etc/nginx/certs/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/game.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server {
        listen 80;
        server_name game.example.com;
        return 301 https://game.example.com$request_uri;
    }

    # Hall pages, API and match administration. Preserve Node response adapters.
    server {
        listen 443 ssl;
        server_name game.example.com;

        location = /admin { proxy_pass http://gogame_match; }
        location ^~ /admin/ { proxy_pass http://gogame_match; }

        location = /internal/v1/do { proxy_pass http://gogame_hall; }
        location = /api/internal/v1/do { proxy_pass http://gogame_hall; }
        # Internal tournament and control routes are not public proxy endpoints.
        location /internal/ { return 404; }
        location /api/internal/ { return 404; }

        location / {
            proxy_pass http://gogame_hall;
        }
    }

    # Keep Node client-web: it adapts JS and injects configured browser endpoints.
    server {
        listen 8444 ssl;
        server_name game.example.com;

        location = /internal/v1/do { proxy_pass http://gogame_hall; }
        location = /api/internal/v1/do { proxy_pass http://gogame_hall; }
        location /internal/ { return 404; }
        location /api/internal/ { return 404; }

        location / {
            proxy_pass http://gogame_client;
        }
    }

    server {
        listen 8445 ssl;
        server_name game.example.com;
        location / {
            proxy_pass http://gogame_game;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $game_connection;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}

# Complete nginx.conf for a private HTTP test environment, without a domain.
# Node is assumed to run on 172.21.211.216; change these upstreams if needed.
# Windows nginx: change the mime.types/log paths for your nginx installation.
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format gogame '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status';
    access_log /var/log/nginx/access.log gogame;
    client_max_body_size 2m;
    map $http_upgrade $game_connection { default upgrade; '' close; }

    upstream gogame_hall { server 172.21.211.216:11042; }
    upstream gogame_client { server 172.21.211.216:4000; }
    upstream gogame_game { server 172.21.211.216:11041; }
    upstream gogame_match { server 172.21.211.216:11040; }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 10031;
        server_name 172.21.211.219;
        location = /admin { proxy_pass http://gogame_match; }
        location ^~ /admin/ { proxy_pass http://gogame_match; }
        location = /internal/v1/do { proxy_pass http://gogame_hall; }
        location = /api/internal/v1/do { proxy_pass http://gogame_hall; }
        location /internal/ { return 404; }
        location /api/internal/ { return 404; }
        location / { proxy_pass http://gogame_hall; }
    }
    server {
        listen 10032;
        server_name 172.21.211.219;
        location = /internal/v1/do { proxy_pass http://gogame_hall; }
        location = /api/internal/v1/do { proxy_pass http://gogame_hall; }
        location /internal/ { return 404; }
        location /api/internal/ { return 404; }
        location / { proxy_pass http://gogame_client; }
    }
    server {
        listen 10033;
        server_name 172.21.211.219;
        location / {
            proxy_pass http://gogame_game;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $game_connection;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
